[package]
name = "multiversx-chain-vm-executor-wasmer-experimental"
version = "0.5.2"
edition = "2024"

authors = ["MultiversX <contact@multiversx.com>"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/multiversx/mx-vm-executor-rs"
homepage = "https://multiversx.com/"
documentation = "https://docs.multiversx.com/"
description = "MultiversX VM Wasmer adapter (experimental)"
keywords = ["multiversx", "blockchain", "VM"]
categories = ["cryptography::cryptocurrencies"]

[lib]

[dependencies.multiversx-chain-vm-executor]
version = "0.5.2"
path = "../vm-executor"

[dependencies]
wasmer = { version = "7.5", default-features = false, features = [
    "singlepass",
    "sys",
    "wat",
    # Gives Store::interrupter(), the only way to stop a call on this backend: every global
    # goes through the Store, which `call` borrows mutably for the whole execution, so the
    # breakpoint global the 2.2 backend writes is unreachable here. Unix-only upstream; see
    # ExperimentalStopHandle for what happens elsewhere.
    "experimental-host-interrupt",
] }
wasmer-types = "7.5"

log = "0.4"
loupe = "0.1.3"
rc-new-cyclic-fallible = "1.1"
thiserror = "2.0"
