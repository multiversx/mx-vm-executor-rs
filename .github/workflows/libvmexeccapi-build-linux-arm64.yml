name: libvmexeccapi-build-linux-arm64

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Build library for Linux ARM64
    runs-on: [ubuntu-22.04]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The same target developers run locally. The Makefile owns the buildx
      # invocation — platform, build args, the `wasmer-fork` named context — so
      # a new Dockerfile input only has to be wired up in one place, and this
      # build cannot drift from `make ci-local`. It leaves the library in
      # $(CI_LOCAL_DIR), hence the artifact path below.
      - name: Build library
        run: make capi-linux-arm64-docker

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-linux-arm
          path: |
            target/ci-local/libvmexeccapi_arm.so
          if-no-files-found: error
